/* Compact, native collapsible navigation and unobtrusive scrolling. */

::-webkit-scrollbar{width:5px;height:5px}

и обращения</h2><p>При подтверждённом нарушении администрация может вынести предупреждение или ограничить доступ к игре. Меры определяются с учётом характера, тяжести и повторяемости нарушения.</p><p>Если вы обнаружили ошибку, столкнулись с нарушением или хотите оспорить решение, обратитесь к администрации через <a href=\"https://t.me/AelisseChat\" target=\"_blank\" rel=\"noopener noreferrer\">сообщество Aelisse</a>. По возможности приложите описание ситуации и подтверждающие материалы.</p>",
"rules-alliances":"<p>При создании и управлении альянсом необходимо соблюдать <a href=\"#rules\">общие правила игры</a> и требования к названиям, тегам и поведению участников.</p><h2>1. Название и тег</h2><div class=\"patron-facts\"><div class=\"patron-fact\"><strong>3–13 букв</strong><span>Название альянса</span></div><div class=\"patron-fact\"><strong>2–4 буквы</strong><span>Тег альянса</span></div></div><ul><li>Допустимы только латинские буквы A–Z.</li><li>Цифры, пробелы и специальные символы не допускаются.</li><li>Название и тег должны быть свободны. Регистр букв не позволяет занять уже используемое имя или тег.</li><li>Тег устанавливается один раз и не может быть изменён средствами игры.</li></ul><h2>2. Запрещённые названия и теги</h2><ul><li>Нецензурные, оскорбительные и дискриминационные выражения.</li><li>Названия и теги, содержащие угрозы или направленные на травлю других участников.</li><li>Имитация другого альянса или администрации с целью введения игроков в заблуждение.</li><li>Названия и теги, используемые для обхода правил игры.</li></ul><h2>3. Создание и управление</h2><div class=\"patron-facts\"><div class=\"patron-fact\"><strong>5&nbsp;000&nbsp;💰</strong><span>Стоимость создания</span></div><div class=\"patron-fact\"><strong>30 участников</strong><span>Максимальный состав</span></div></div><div class=\"patron-cards\"><div class=\"patron-card\"><div><h3>Глава</h3><p>Управляет альянсом, назначает и снимает заместителей. Для роспуска альянса необходимо, чтобы в нём не осталось других участников.</p></div></div><div class=\"patron-card\"><div><h3>Заместители</h3><p>В альянсе может быть не более двух заместителей. Они получают дополнительные полномочия по управлению участниками.</p></div></div><div class=\"patron-card\"><div><h3>Участники</h3><p>Вступают в альянс по приглашению и могут покинуть его по собственному желанию. Одновременно игрок может состоять только в одном альянсе.</p></div></div></div><h2>4. Поведение и ответственность</h2><ul><li>Запрещ "rules-nicknames":"<p>Игровой ник — уникальное имя персонажа, отображаемое в профиле, рейтингах и других игровых разделах.</p><h2>1. Требования к нику</h2><div class=\"patron-facts\"><div class=\"patron-fact\"><strong>3–12 букв</strong><span>Допустимая длина</span></div><div class=\"patron-fact\"><strong>30 дней</strong><span>Интервал между сменами</span></div></div><ul><li>Только латиница A–Z или русская кириллица А–Я, включая Ё. Смешивание алфавитов запрещено.</li><li>Без цифр, пробелов, эмодзи и специальных символов.</li><li>Ник должен быть уникальным: регистр букв и визуально схожие буквы разных алфавитов учитываются при проверке совпадений.</li></ul><h2>2. Примеры</h2><table class=\"stats-table\"><thead><tr><th scope=\"col\">Ник</th><th scope=\"col\">Соответствие формату</th></tr></thead><tbody><tr><th scope=\"row\">Artemis</th><td>Допустимый формат</td></tr><tr><th scope=\"row\">Лунария</th><td>Допустимый формат</td></tr><tr><th scope=\"row\">Artemis123</th><td>Содержит цифры</td></tr><tr><th scope=\"row\">Dark Wolf</th><td>Содержит пробел</td></tr><tr><th scope=\"row\">ЛунаFox</th><td>Смешение алфавитов</td></tr><tr><th scope=\"row\">Admin</th><td>Зарезервированное имя</td></tr></tbody></table><h2>3. Запрещённые ники</h2><ul><li>Оскорбительные и нецензурные выражения, дискриминационные высказывания и угрозы.</li><li>Имена, имитирующие других игроков с целью обмана или выдающие владельца за представителя администрации.</li><li>Служебные и зарезервированные названия, в том числе имена, начинающиеся с защищённых служебных обозначений.</li></ul><p>Формат, уникальность и служебные названия проверяются автоматически. Остальные нарушения рассматриваются администрацией в соответствии с <a href=\"#rules\">общими правилами игры</a>.</p><h2>4. Смена ника</h2><p>Смена игрового ника бесплатна и доступна один раз в 30 дней.</p><ol class=\"battle-steps\"><li>Откройте меню командой «Ник».</li><li>Нажмите «Изменить».</li><li>Отправьте новый ник ответом на сообщение бота.</li></ol><p>Если ник недоступен или не соответствует требованиям, выберите другой вариант.</p>",

alliance:"<p>Альянсы позволяют игрокам объединяться, развиваться вместе и соперничать за позиции в рейтинге альянсов.</p><h2>Создание альянса</h2><div class=\"patron-facts\"><div class=\"patron-fact\"><strong class=\"alliance-cost\">5&nbsp;000&nbsp;💰</strong><span>Стоимость создания</span></div><div class=\"patron-fact\"><strong>30</strong><span>Максимум участников</span></div></div><p style=\"margin-top:16px\">Каждый альянс имеет собственное название и может установить уникальный тег, отображаемый в рейтинге игроков.</p><h2>Иерархия</h2><div class=\"patron-cards\"><div class=\"patron-card\"><div><h3>Глава</h3><p>Создатель альянса, обладающий полным управлением.</p></div></div><div class=\"patron-card\"><div><h3>Заместитель</h3><p>Участник с дополнительными полномочиями по управлению альянсом.</p></div></div><div class=\"patron-card\"><div><h3>Участник</h3><p>Рядовой член альянса.</p></div></div></div><h2>Мощность альянса</h2><p>Мощность альянса складывается из мощности всех его участников и определяет его позицию в <a href=\"#rating\">общем рейтинге</a>.</p><h2>Управление</h2><table class=\"stats-table\"><thead><tr><th scope=\"col\">Команда</th><th scope=\"col\">Действие</th></tr></thead><tbody>"+"<tr><th scope=\"row\">"+commandButton("Нас", true)+"</th><td>Настройки альянса</td></tr>"+"<tr><th scope=\"row\">"+commandButton("Пас", true)+"</th><td>Пригласить игрока</td></tr>"+"<tr><th scope=\"row\">"+commandButton("+зам", true)+"</th><td>Назначить заместителя</td></tr>"+"<tr><th scope=\"row\">"+commandButton("-зам", true)+"</th><td>Снять заместителя</td></tr>"+"<tr><th scope=\"row\">"+commandButton("-ас", true)+"</th><td>Исключить участника</td></tr>"+"<tr><th scope=\"row\">"+commandButton("!вас", true)+"</th><td>Покинуть альянс</td></tr>"+"</tbody></table><p>Команда приглашения используется в ответ на сообщение игрока. Назначение заместителей и исключение участников доступны при наличии соответствующих полномочий.</p>",
battle:"<p>Испытайте силу своего персонажа в дружеских поединках с другими игроками.</p><h2>Как начать сражение</h2><ol class=\"battle-steps\"><li>Ответьте словом <strong>Вызов</strong> на сообщение соперника в <a href=\"https://t.me/AelisseChat\" target=\"_blank\" rel=\"noopener noreferrer\">игровом чате</a>.</li><li>Дождитесь принятия вызова.</li><li>После принятия сражение пройдёт автоматически.</li></ol><p>Приглашение действительно в течение 5 минут.</p><h2>Боевая система</h2><p>Исход сражения зависит от основных и дополнительных <a href=\"#stats\">характеристик</a> персонажей, а также бонусов <a href=\"#patrons\">покровителей</a>.</p><h2>Статистика сражения</h2><p>После завершения поединка обоим участникам доступна подробная статистика:</p><div class=\"patron-cards\"><div class=\"patron-card\"><div><h3>Урон</h3><p>Статистика нанесённого урона.</p></div></div><div class=\"patron-card\"><div><h3>Лечение</h3><p>Статистика восстановления здоровья.</p></div></div><div class=\"patron-card\"><div><h3>События</h3><p>Подробный ход сражения.</p></div></div></div><h2>Особенности</h2><p>Дружеские поединки не расходуют игровые ресурсы и не влияют на рейтинг. За победу или поражение не предусмотрено наград и штрафов.</p>",
rating:"<p>Рейтинги позволяют сравнивать достижения в развитии персонажей и альянсов. Позиции определяются по мощности 🦴.</p><h2>👤 Рейтинг игроков</h2><div class=\"patron-facts\"><div class=\"patron-fact\"><strong>50</strong><span>Лучших игроков</span></div><div class=\"patron-fact\"><strong>10</strong><span>Игроков на странице</span></div></div><p style=\"margin-top:16px\">Игроки располагаются по убыванию <a href=\"#stats\">мощности</a> персонажа. Улучшайте снаряжение, чтобы подниматься в рейтинге.</p>"+commandButtons(["Топ", "Рейтинг"])+"<h2>🏰 Рейтинг альянсов</h2><div class=\"patron-facts\"><div class=\"patron-fact\"><strong>10</strong><span>Лучших альянсов</span></div><div class=\"patron-fact\"><strong>🦴</strong><span>Общая мощность</span></div></div><p style=\"margin-top:16px\">Позиция <a href=\"#alliance\">альянса</a> определяется суммарной мощностью всех его участников.</p>"+commandButtons(["Рас", "Рейтинг альянсов"])+"<h2>Переключение рейтингов</h2><p>Используйте кнопку 🏰 в рейтинге игроков для перехода к альянсам и кнопку 👤 для возвращения к рейтингу игроков.</p>",
ach:'<p>Достижения отражают прогресс персонажа в различных направлениях игры. Выполняйте условия достижений, получайте награды и открывайте уникальные <a href="#titles">титулы</a>.</p><h2>Категории достижений</h2><div class="patron-cards"><div class="patron-card"><div class="patron-icon">👥</div><div><h3>Влияние</h3><p>Приглашайте новых игроков по <a href="#ref">реферальной ссылке</a>. Прогресс зависит от количества активированных рефералов.</p></div></div><div class="patron-card"><div class="patron-icon">🔨</div><div><h3>Закалка</h3><p>Создавайте снаряжение с помощью <a href="#forge">ковки</a> и <a href="#auto">автоковки</a>. Прогресс зависит от общего количества выполненных ковок.</p></div></div></div><h2>Прогресс и награды</h2><p>В каждой категории предусмотрено семь достижений. По мере их выполнения можно получить монеты, попытки ковки и алмазы. Последнее достижение каждой категории открывает особый <a href="#titles">титул</a>.</p>',
titles:'<p>Титулы — особые знаки отличия, которые можно получить за выполнение <a href="#ach">достижений</a>. Выбранный титул отображается в профиле персонажа.</p><h2>Доступные титулы</h2><div class="patron-cards"><div class="patron-fact"><span>👥 Влияние</span><strong>Избранный</strong><span>Активировать 100 рефералов.</span></div><div class="patron-fact"><span>🔨 Закалка</span><strong>Творец</strong><span>Выполнить 50 000 ковок.</span></div></div><h2>Особенности</h2><p>Титулы позволяют подчеркнуть свои достижения и выделиться среди других игроков.</p>',
rest:"<p>Отдых — способ пассивного получения монет и попыток ковки. Награды накапливаются со временем, даже когда вы не играете.</p><h2>Накопление ресурсов</h2><div class=\"patron-facts\"><div class=\"patron-fact\"><strong>2 мин. 30 сек.</strong><span>Интервал начисления</span></div><div class=\"patron-fact\"><strong>8 часов</strong><span>Максимальный период накопления</span></div></div><h2>Награда за 8 часов</h2><div class=\"patron-facts\"><div class=\"patron-fact\"><strong class=\"alliance-cost\">192&nbsp;🔨</strong><span>Попытки ковки</span></div><div class=\"patron-fact\"><strong class=\"alliance-cost\">180&nbsp;💰</strong><span>Монеты</span></div></div><h2>Как собрать награду</h2><ol class=\"battle-steps\"><li>Подпишитесь на <a href=\"https://t.me/AelisseNews\" target=\"_blank\" rel=\"noopener noreferrer\">канал Aelisse</a>.</li><li>Откройте меню отдыха одной из команд ниже.</li><li>Нажмите кнопку сбора награды.</li></ol><p>Сбор доступен не ранее чем через 5 минут. После достижения лимита в 8 часов ресурсы перестают накапливаться до следующего сбора.</p><p>Полученные ресурсы можно использовать для <a href=\"#forge\">ковки</a> и улучшения <a href=\"#anvil\">наковальни</a>.</p>",
ref:"<p>Приглашайте новых игроков в Aelisse по персональной реферальной ссылке и получайте дополнительные ресурсы.</p><h2>Награда</h2><div class=\"patron-facts\"><div class=\"patron-fact\"><strong class=\"alliance-cost\">250&nbsp;💰</strong><span>Монеты</span></div><div class=\"patron-fact\"><strong class=\"alliance-cost\">50&nbsp;🔨</strong><span>Попытки ковки</span></div></div><p style=\"margin-top:16px\">Приглашённый игрок получает награду при регистрации, а пригласивший — после активации реферала.</p><h2>Условия активации</h2><div class=\"patron-cards\"><div class=\"patron-card\"><div><h3>3-й уровень наковальни</h3><p>Достичь как минимум 3-го уровня.</p></div></div><div class=\"patron-card\"><div><h3>50 ковок</h3><p>Выполнить не менее 50 ковок.</p></div></div><div class=\"patron-card\"><div><h3>6 часов</h3><p>С момента регистрации должно пройти не менее 6 часов.</p></div></div></div><h2>Как пригласить игрока</h2><ol class=\"battle-steps\"><li>Откройте реферальное меню.</li><li>Нажмите «Поделиться ссылкой» и отправьте её новому игроку.</li><li>После выполнения всех условий награда начислится автоматически.</li></ol><h2>Статистика и достижения</h2><p>В реферальном меню отображается количество приглашённых, активированных и ожидающих игроков, а также сумма полученных наград. Список рефералов доступен по кнопке «Приглашённые».</p><p>Активированные рефералы учитываются в категории <a href=\"#ach\">«Влияние»</a>. За её завершение можно получить <a href=\"#titles\">титул «Избранный»</a>.</p>",

const emojiFallbackPattern = /(?:\p{Regional_Indicator}{2}|[0-9#*]\uFE0F?\u20E3|\p{Extended_Pictographic}\uFE0F?(?:\p{Emoji_Modifier})?(?:\u200D\p{Extended_Pictographic}\uFE0F?(?:\p{Emoji_Modifier})?)*)/gu;
const failedEmojiUrls = new Set();

function emojiImage(emoji) {
    const wrapper = document.createElement('span');
    wrapper.className = 'emoji-token';
    const fallback = document.createElement('span');
    fallback.className = 'emoji-fallback';
    fallback.textContent = emoji;
    const image = document.createElement('img');
    image.className = 'apple-emoji';
    image.alt = emoji;
    image.hidden = true;
    image.decoding = 'async';
    image.referrerPolicy = 'no-referrer';
    const normalized = emoji === '⚪️' ? '⚪' : emoji;
    const toFilename = value => Array.from(value, char =>
        char.codePointAt(0).toString(16).padStart(4, '0')).join('-') + '.png';
    const variants = [...new Set([normalized, normalized.replace(/\uFE0F/g, '')])];
    const urls = variants.map(value => emojiCdn + toFilename(value));
    let index = 0;
    function next() {
        while (index < urls.length && failedEmojiUrls.has(urls[index])) index++;
        if (index < urls.length) image.src = urls[index++];
    }
    image.addEventListener('load', () => {
        image.hidden = false;
        fallback.hidden = true;
    });
    image.addEventListener('error', () => {
        failedEmojiUrls.add(image.src);
        next();
    });
    wrapper.append(fallback, image);
    next();
    return wrapper;
}

function renderAppleEmoji(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
            return !node.parentElement?.closest('.emoji-token,script,style,textarea,code,pre,svg')
                && emojiPattern.test(node.data)
                ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        }
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {
        const text = node.data;
        const segments = emojiSegmenter
            ? Array.from(emojiSegmenter.segment(text), part => ({value: part.segment, index: part.index}))
            : Array.from(text.matchAll(emojiFallbackPattern), part => ({value: part[0], index: part.index}));
        const fragment = document.createDocumentFragment();
        let offset = 0;
        for (const {value, index} of segments) {
            if (!emojiPattern.test(value) || value.includes('\uFE0E')) continue;
            fragment.append(text.slice(offset, index), emojiImage(value));
            offset = index + value.length;
        }
        if (offset) {
            fragment.append(text.slice(offset));
            node.replaceWith(fragment);
        }
    }
}

function render(id){if(!Object.hasOwn(articles,id))id='home';main.innerHTML=id==='home'?home:'<div class="crumb">'+categories[id]+' / '+names[id]+'</div><article class="article"><h1>'+names[id]+'</h1>'+articles[id]+commandSection(id)+'<div class="copy-status" role="status" aria-live="polite"></div></article>'+footer;renderAppleEmoji(main);document.querySelectorAll('nav button').forEach(b=>{const active=b.dataset.page===id;b.classList.toggle('active',active);if(active){b.setAttribute('aria-current','page');const group=b.closest('details');if(group)group.open=true;}else b.removeAttribute('aria-current');});input.value='';results.innerHTML='';aside.classList.remove('open');menu.setAttribute('aria-expanded','false');}
function navigate(id){if(location.hash==='#'+id)render(id);else location.hash=id;window.scrollTo(0,0);}
window.addEventListener('hashchange',()=>render(location.hash.slice(1)));render(location.hash.slice(1));
const copyTimers = new WeakMap();
function legacyCopy(value) {
    const focused = document.activeElement;
    const selection = document.getSelection();
    const ranges = selection ? Array.from({length: selection.rangeCount}, (_, index) => selection.getRangeAt(index).cloneRange()) : [];
    const field = document.createElement('textarea');
    field.value = value;
    field.readOnly = true;
    field.style.cssText = 'position:fixed;left:0;top:0;opacity:0;pointer-events:none;font-size:16px';
    document.body.append(field);
    try {
        field.focus({preventScroll:true});
        field.select();
        field.setSelectionRange(0, value.length);
        return document.execCommand('copy');
    } finally {
        field.remove();
        if (focused instanceof HTMLElement) focused.focus({preventScroll:true});
        if (selection && ranges.length) {
            selection.removeAllRanges();
            for (const range of ranges) selection.addRange(range);
        }
    }
}
async function copyCommand(button) {
    const command = button.dataset.command;
    if (!command || button.dataset.state === 'pending') return;
    clearTimeout(copyTimers.get(button));
    button.dataset.state = 'pending';
    let copied = false;
    try {
        if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(command);
            copied = true;
        }
    } catch { /* Local files and restricted browsers may deny Clipboard API. */ }
    if (!copied) {
        try { copied = legacyCopy(command); } catch { /* Report failure below. */ }
    }
    if (!button.isConnected) return;
    const label = button.querySelector('.command-label');
    label.textContent = copied ? 'Скопировано' : 'Не удалось';
    button.dataset.state = copied ? 'success' : 'error';
    button.querySelector('svg').outerHTML = copied ? checkIcon : copyIcon;
    const status = main.querySelector('.copy-status');
    if (status) status.textContent = copied ? 'Скопировано: ' + command : 'Не удалось скопировать команду ' + command;
    copyTimers.set(button, setTimeout(() => {
        label.textContent = command;
        button.querySelector('svg').outerHTML = copyIcon;
        delete button.dataset.state;
    }, 1500));
}
document.addEventListener('click',e=>{const copy=e.target.closest('[data-command]');if(copy){void copyCommand(copy);return;}const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page);else if(e.target.closest('.menu'))menu.setAttribute('aria-expanded',String(aside.classList.toggle('open')));else if(!e.target.closest('.search'))results.innerHTML='';});
input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase();results.innerHTML=q?Object.keys(names).filter(k=>(names[k]+articles[k]).toLowerCase().includes(q)).slice(0,6).map(k=>'<button data-page="'+k+'">'+names[k]+'</button>').join('')||'<div style="padding:10px">Ничего не найдено</div>':'';});
input.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=results.querySelector('button');if(b)navigate(b.dataset.page);}if(e.key==='Escape')results.innerHTML='';});
